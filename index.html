<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>개인정보 처리방침</title>
    <script src="https://code.jquery.com/jquery-1.9.1.js"></script>
  </head>
  <body>
    <main class="privacy-policy" data-policy-type="personal">
      <!-- 신버전 처리방침만 fetch로 들어가는 영역 -->
      <div id="policyContent" hidden aria-live="polite"></div>

      <!-- 구버전 35개 처리방침은 기존 iframe 구조 유지 -->
      <iframe
        src="./ec/private_info35.html"
        frameborder="0"
        id="privateInfo"
        scrolling="no"
        style="width: 100%; height: 9492px"
        title="개인정보 처리방침 상세 내용"
      ></iframe>

      <!-- 구버전 셀렉트 파일이 AJAX로 들어가는 영역 -->
      <div class="bot">
        <div class="ver_certi">
          <p id="private_sel"></p>
        </div>
      </div>
    </main>

    <script>
      $(function () {
        $.ajax({
          type: "get",
          url: "./ec/private_select.html",
          dataType: "html",
          success: function (data) {
            $("#private_sel").append(data);

            // 실제 운영 코드에서는 기존 35개 높이값을 그대로 유지합니다.
            var infoHei = new Array("9492", "9492");
            var goUrl = $("#goSelect > option:selected").val();
            var goIndex = $("#goSelect > option").index(
              $("#goSelect > option:selected"),
            );

            $("#goSelect").change(function () {
              goUrl = $("#goSelect > option:selected").val();
              goIndex = $("#goSelect > option").index(
                $("#goSelect > option:selected"),
              );
            });

            $(".input_btn").click(function (event) {
              var selectedOption = $("#goSelect > option:selected");

              // 신버전은 common.js에서 fetch로 처리합니다.
              if (selectedOption.data("policy-type") === "new") {
                return;
              }

              event.preventDefault();
              $("#policyContent").prop("hidden", true);
              $("#privateInfo").prop("hidden", false);
              $("#privateInfo").css("height", infoHei[goIndex]);
              $("#privateInfo").attr("src", goUrl);
              $("html, body").stop().animate({ scrollTop: 0 }, 0);
            });

            $(".input_btn").wrap('<span class="btn9"></span>');

            // AJAX로 셀렉트가 만들어진 뒤 신버전 초기화를 시작합니다.
            document.dispatchEvent(new CustomEvent("policySelectorReady"));
          },
          error: function (_xhr, _status, error) {
            console.error("구버전 선택 목록 로드 실패", error);
          },
        });
      });
    </script>
    <script src="./common.js"></script>
  </body>
</html>
