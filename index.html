<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>개인정보 처리방침</title>
    <script src="https://code.jquery.com/jquery-1.9.1.js"></script>
  </head>
  <body>

	<div class="content">
		<iframe src="privacy-policy/personal/privacy_policy_v1.0.html" frameborder="0" hspace="0" vspace="0" marginwidth="0" marginheight="0" scrolling="no" style="width: 100%; height: 24050px" id="privateInfo" title="개인정보처리방침 상세내용"></iframe>
    <div class="box_rull" style="border-top: none; margin-top: -4px;">
      <div class="bot">
        <div class="ver_certi">
          <p class="mgt10" id="private_sel"></p>
        </div>
      </div>
    </div>
	</div>
    <script>
      $.ajax({
        type: 'get',
        url: 'ec/private_select.html',
        dataType: 'html',
        success : function(data) {
          $('#private_sel').append(data);
          infoHei = new Array('24050', '9492');

          $('#goSelect').change(function() {
            goUrl = $('#goSelect > option:selected').val();
            goIndex  = $('#goSelect > option').index($('#goSelect > option:selected'));
          });

          $('.input_btn').click(function() {
            $('#privateInfo').css('height', infoHei[goIndex]);
            $('#privateInfo').attr('src', goUrl);
            $('html, body').stop().animate({scrollTop: 0}, 0);
          });

          $('.input_btn').wrap('<span class="btn9"></span>');
        }
      })
    </script>
    <script src="./common.js"></script>
  </body>
</html>
